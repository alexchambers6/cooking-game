<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <!-- Make the page fit the phone screen and stop accidental zooming -->
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <!-- Lets the game run full-screen if added to the iPhone home screen -->
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="Cooking Game">
  <title>Cooking Game</title>

  <style>
    /* ============================================================
       COLOURS
       A soft, cosy palette: cream walls, powder-blue cupboards,
       peach accents and warm wood.
       ============================================================ */
    :root {
      --ink: #4b3832;          /* soft dark-brown outline */
      --text: #4b3832;
      --cream: #fbf1e1;        /* walls */
      --tile: #dfeaf2;         /* blue-grey wall tiles */
      --tile-line: #c6d7e4;
      --cabinet: #92b4d4;      /* powder-blue cupboards */
      --cabinet-light: #a9c5df;
      --peach: #f4a582;
      --coral: #e9735b;
      --wood-light: #f1c896;
      --wood: #dca56e;
      --wood-dark: #b9814c;
      --stove: #f6ecd9;        /* cream enamel stove */
      --metal: #cfd8df;
      --grate: #3d3a3a;
      --green: #6cc57c;
      --blue: #6aaee8;
      --batter: #f6e3b4;
      --sludge: #6f7d3c;
    }

    * {
      box-sizing: border-box;
    }

    html, body {
      height: 100%;
      margin: 0;
    }

    body {
      font-family: -apple-system, "Segoe UI", Roboto, sans-serif;
      background: #f3e3cc;
      color: var(--text);
      overflow: hidden;                      /* the game fills the screen, no scrolling */
      -webkit-tap-highlight-color: transparent;
      user-select: none;
      -webkit-user-select: none;
    }

    /* The whole game: a column that fills the phone screen */
    .game {
      height: 100vh;
      height: 100dvh;                        /* better height on iPhone, if supported */
      max-width: 480px;
      margin: 0 auto;
      display: flex;
      flex-direction: column;
      padding: calc(env(safe-area-inset-top) + 8px) 12px calc(env(safe-area-inset-bottom) + 10px);
      gap: 8px;
    }

    /* ============================================================
       TOP: coins and the recipe card
       ============================================================ */
    .hud {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .coins {
      background: white;
      border: 2.5px solid var(--ink);
      border-radius: 999px;
      padding: 6px 12px;
      font-size: 18px;
      font-weight: 800;
      white-space: nowrap;
    }

    .coins.pop {
      animation: pop 0.3s ease;
    }

    @keyframes pop {
      50% { transform: scale(1.25); }
    }

    /* The recipe card, pinned up like a note */
    .recipe {
      flex: 1;
      background: #fffdf7;
      border: 2.5px solid var(--ink);
      border-radius: 12px;
      padding: 6px 10px;
      transform: rotate(-1deg);
      box-shadow: 0 3px 0 rgba(75, 56, 50, 0.25);
    }

    .recipe-title {
      font-size: 14px;
      font-weight: 800;
    }

    .recipe-slots {
      display: flex;
      align-items: center;
      gap: 4px;
      margin-top: 3px;
      font-size: 13px;
    }

    /* One empty box on the recipe card (fills with an emoji when done) */
    .slot {
      width: 26px;
      height: 26px;
      border: 2px dashed #c9b8a8;
      border-radius: 7px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 16px;
    }

    .slot.filled {
      border: 2px solid var(--green);
      background: #eefaf0;
    }

    /* ============================================================
       MESSAGE LINE
       ============================================================ */
    .message {
      min-height: 40px;
      display: flex;
      align-items: center;
      justify-content: center;
      text-align: center;
      font-size: 15px;
      font-weight: 700;
      line-height: 1.25;
      padding: 0 6px;
    }

    .message.good { color: #2f8a45; }
    .message.oops { color: #d9480f; }

    /* ============================================================
       THE ROOM: two views side by side (kitchen, pantry).
       Turning around slides from one to the other.
       ============================================================ */
    .viewport {
      flex: 1;
      position: relative;
      overflow: hidden;
      border: 3px solid var(--ink);
      border-radius: 22px;
      background: var(--cream);
      min-height: 0;   /* lets it shrink on small phones */
    }

    .room {
      display: flex;
      width: 200%;
      height: 100%;
      transition: transform 0.7s cubic-bezier(0.65, 0, 0.35, 1);
    }

    /* Facing the pantry: slide the room left by one view */
    .room.facing-pantry {
      transform: translateX(-50%);
    }

    /* A little "dip" while turning, like your head moving */
    .viewport.turning {
      animation: turn-dip 0.7s ease;
    }

    @keyframes turn-dip {
      50% { transform: scale(0.96); }
    }

    .view {
      width: 50%;
      height: 100%;
      position: relative;
      display: flex;
      flex-direction: column;
    }

    /* ============================================================
       KITCHEN VIEW
       ============================================================ */

    /* --- The wall: cream on top, tiles lower down --- */
    .wall {
      flex: 1;
      position: relative;
      min-height: 170px;
      background: var(--cream);
    }

    .backsplash {
      position: absolute;
      left: 0;
      right: 0;
      bottom: 0;
      height: 42%;
      background-color: var(--tile);
      background-image:
        linear-gradient(var(--tile-line) 2px, transparent 2px),
        linear-gradient(90deg, var(--tile-line) 2px, transparent 2px);
      background-size: 26px 26px;
      border-top: 2.5px solid var(--ink);
    }

    /* --- The serving hatch (window) where customers appear --- */
    .hatch {
      position: absolute;
      left: 12px;
      top: 14px;
      width: 46%;
      height: 60%;
      max-height: 210px;
      border: 8px solid var(--wood);
      outline: 2.5px solid var(--ink);
      border-radius: 16px 16px 6px 6px;
      overflow: hidden;
      /* Sky outside, with two soft clouds */
      background:
        radial-gradient(ellipse 30px 12px at 30% 28%, white 90%, transparent),
        radial-gradient(ellipse 22px 9px at 75% 18%, white 90%, transparent),
        linear-gradient(#a9d8f0, #e4f4fb);
    }

    /* Scalloped peach curtain along the top of the window */
    .valance {
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      height: 18px;
      background:
        radial-gradient(circle at 10px 8px, var(--peach) 10px, transparent 10.5px) 0 0 / 20px 18px repeat-x;
      z-index: 2;
    }

    /* The customer, peeking in through the hatch */
    .customer {
      position: absolute;
      left: 50%;
      bottom: -6px;
      font-size: 78px;
      line-height: 1;
      transform: translateX(-50%);
      animation: bob 2.4s ease-in-out infinite;
    }

    @keyframes bob {
      0%, 100% { transform: translateX(-50%) translateY(0); }
      50% { transform: translateX(-50%) translateY(-4px); }
    }

    .customer.bounce {
      animation: bounce 0.5s ease 3;
    }

    @keyframes bounce {
      0%, 100% { transform: translateX(-50%) translateY(0); }
      50% { transform: translateX(-50%) translateY(-18px); }
    }

    /* A new customer pops up from below */
    .customer.arrive {
      animation: arrive 0.6s ease-out;
    }

    @keyframes arrive {
      from { transform: translateX(-50%) translateY(100%); }
      to { transform: translateX(-50%) translateY(0); }
    }

    /* The wooden window sill, with a little plant */
    .sill {
      position: absolute;
      left: 4px;
      width: calc(46% + 16px);
      height: 12px;
      background: var(--wood-light);
      border: 2.5px solid var(--ink);
      border-radius: 4px;
    }

    .plant {
      position: absolute;
      font-size: 28px;
      line-height: 1;
    }

    /* --- The speech bubble --- */
    .bubble {
      position: absolute;
      right: 12px;
      top: 18px;
      width: 44%;
      background: white;
      border: 2.5px solid var(--ink);
      border-radius: 16px;
      padding: 8px 10px;
      font-size: 15px;
      font-weight: 700;
      z-index: 3;
    }

    .bubble::before {
      content: "";
      position: absolute;
      left: -13px;
      top: 16px;
      border: 7px solid transparent;
      border-right: 10px solid var(--ink);
    }

    /* --- Cooker hood above the stove --- */
    .hood {
      position: absolute;
      right: 20px;
      bottom: 58px;
      width: 44%;
      height: 44px;
      background: linear-gradient(90deg, #efe2c9, var(--stove) 40%, #efe2c9);
      border: 2.5px solid var(--ink);
      border-radius: 12px 12px 4px 4px;
      z-index: 1;
    }

    /* The chimney going up from the hood */
    .hood::before {
      content: "";
      position: absolute;
      left: 34%;
      width: 32%;
      bottom: 100%;
      height: 400px;            /* tall enough to reach past the top of the tiles */
      background: var(--stove);
      border: 2.5px solid var(--ink);
      border-bottom: none;
    }

    /* Warm light under the hood */
    .hood::after {
      content: "";
      position: absolute;
      left: 30%;
      right: 30%;
      bottom: 4px;
      height: 5px;
      border-radius: 999px;
      background: #ffe8a3;
      border: 1.5px solid var(--ink);
    }

    /* --- A little wall shelf with pretty things on it --- */
    .wall-shelf {
      position: absolute;
      left: 14px;
      bottom: 46px;
      width: 40%;
      z-index: 1;
    }

    .wall-shelf-items {
      display: flex;
      justify-content: space-around;
      align-items: flex-end;
      font-size: 28px;
      line-height: 1;
      padding: 0 4px;
    }

    .wall-shelf-plank {
      height: 10px;
      background: var(--wood-light);
      border: 2.5px solid var(--ink);
      border-radius: 4px;
      box-shadow: 0 5px 6px rgba(0, 0, 0, 0.12);
    }

    /* --- The utensil rail with tools hanging from it --- */
    .rail {
      position: absolute;
      right: 14px;
      width: 42%;
      height: 8px;
      background: linear-gradient(#eef2f5, #aab5be);
      border: 2px solid var(--ink);
      border-radius: 999px;
      z-index: 2;
    }

    .tools {
      position: absolute;
      right: 14px;
      width: 42%;
      display: flex;
      justify-content: space-around;
      z-index: 2;
    }

    /* One hanging tool (a button): hook, tool, little tag */
    .tool {
      background: none;
      border: none;
      padding: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      font-family: inherit;
      color: var(--text);
      transform-origin: top center;
      animation: swing 3s ease-in-out infinite;
      touch-action: manipulation;
    }

    .tool:nth-child(2) {
      animation-delay: -1.5s;   /* swing out of step with the first tool */
    }

    @keyframes swing {
      0%, 100% { transform: rotate(-3deg); }
      50% { transform: rotate(3deg); }
    }

    .tool .hook {
      width: 3px;
      height: 14px;
      background: var(--ink);
      border-radius: 2px;
    }

    .tool .tool-emoji {
      font-size: 40px;
      line-height: 1;
      transform: rotate(180deg);   /* hanging upside down from the hook */
      filter: drop-shadow(2px 3px 0 rgba(0, 0, 0, 0.15));
    }

    .tool .tag {
      margin-top: 2px;
      background: white;
      border: 2px solid var(--ink);
      border-radius: 6px;
      padding: 1px 6px;
      font-size: 11px;
      font-weight: 800;
    }

    /* Taken off the rail */
    .tool.used {
      opacity: 0.3;
      animation: none;
    }

    /* A "no thanks" shake for the wrong tool */
    .shake {
      animation: shake 0.4s ease !important;
    }

    @keyframes shake {
      25% { transform: translateX(-5px) rotate(-6deg); }
      75% { transform: translateX(5px) rotate(6deg); }
    }

    /* --- The worktop: bowl on the counter, stove top on the right --- */
    .worktop {
      height: 128px;
      position: relative;
      flex-shrink: 0;
      background-color: var(--tile);
      background-image:
        linear-gradient(var(--tile-line) 2px, transparent 2px),
        linear-gradient(90deg, var(--tile-line) 2px, transparent 2px);
      background-size: 26px 26px;
    }

    /* The wooden counter surface */
    .counter-top {
      position: absolute;
      left: 0;
      right: 0;
      bottom: 0;
      height: 26px;
      border-top: 2.5px solid var(--ink);
      background:
        repeating-linear-gradient(90deg, rgba(0, 0, 0, 0.05) 0 2px, transparent 2px 30px),
        linear-gradient(var(--wood-light) 0 60%, var(--wood) 60%);
    }

    /* The cream stove top with two burners */
    .stove-top {
      position: absolute;
      right: 10px;
      bottom: 0;
      width: 52%;
      height: 30px;
      background: var(--stove);
      border: 2.5px solid var(--ink);
      border-bottom: none;
      border-radius: 8px 8px 0 0;
    }

    .burner {
      position: absolute;
      top: 5px;
      width: 40%;
      height: 14px;
      border-radius: 50%;
      background: radial-gradient(ellipse, #6b6464 30%, var(--grate) 60%);
      border: 2px solid var(--grate);
    }

    .burner.back { left: 6%; }
    .burner.front { right: 6%; }

    /* Gas flames under the pan (only shown while cooking) */
    .flames {
      position: absolute;
      right: 10%;
      top: -4px;
      width: 32%;
      display: flex;
      justify-content: space-around;
      z-index: 1;
    }

    .flame {
      width: 8px;
      height: 13px;
      border-radius: 50% 50% 50% 50% / 65% 65% 35% 35%;
      background: linear-gradient(#ffd166, #ff8a3d 60%, #5aa9e6);
      animation: flicker 0.25s ease-in-out infinite alternate;
    }

    /* Flames under the pot on the back burner */
    .flames.back {
      right: auto;
      left: 10%;
    }

    .flame:nth-child(2) { animation-delay: 0.1s; }
    .flame:nth-child(3) { animation-delay: 0.05s; }

    @keyframes flicker {
      to { transform: scaleY(1.3) translateY(-2px); }
    }

    /* A steaming pot on the back burner, just for looks */
    .pot {
      position: absolute;
      bottom: 24px;
      width: 48px;
      height: 40px;
      border: 2.5px solid var(--ink);
      border-radius: 6px 6px 14px 14px;
      background: linear-gradient(90deg, #7fb2b0, #b8dcd9 35%, #7fb2b0);
      z-index: 2;
    }

    /* Pot rim */
    .pot::before {
      content: "";
      position: absolute;
      left: -6px;
      right: -6px;
      top: -6px;
      height: 10px;
      background: #9cc9c6;
      border: 2.5px solid var(--ink);
      border-radius: 6px;
    }

    /* Pot handle */
    .pot::after {
      content: "";
      position: absolute;
      left: -14px;
      top: 10px;
      width: 10px;
      height: 6px;
      border: 2.5px solid var(--ink);
      border-radius: 4px;
      background: #9cc9c6;
    }

    /* Puffs of steam rising from the pot */
    .steam {
      position: absolute;
      top: -18px;
      width: 12px;
      height: 12px;
      border-radius: 50%;
      background: white;
      opacity: 0;
      animation: steam 2.4s ease-out infinite;
    }

    @keyframes steam {
      0% { transform: translateY(0) scale(0.6); opacity: 0; }
      30% { opacity: 0.9; }
      100% { transform: translateY(-40px) scale(1.5); opacity: 0; }
    }

    /* Boiling: the pot rattles and steams much faster */
    .pot.boiling {
      animation: rattle 0.15s linear infinite;
    }

    .pot.boiling .steam {
      animation-duration: 0.8s;
    }

    @keyframes rattle {
      50% { transform: translateY(-1px) rotate(1deg); }
    }

    /* Little white tags on the pot and oven ("Boil", "Bake") */
    .appliance-tag {
      position: absolute;
      left: 50%;
      top: 50%;
      transform: translate(-50%, -50%);
      background: white;
      border: 2px solid var(--ink);
      border-radius: 6px;
      padding: 0 5px;
      font-size: 10px;
      font-weight: 800;
      color: var(--text);
      white-space: nowrap;
    }

    /* The knife that appears where you tap when chopping */
    .chop-knife {
      position: absolute;
      font-size: 34px;
      line-height: 1;
      pointer-events: none;
      z-index: 6;
      animation: chop 0.25s ease-out forwards;
    }

    @keyframes chop {
      0% { transform: translate(-50%, -110%) rotate(-40deg); }
      60% { transform: translate(-50%, -60%) rotate(0deg); opacity: 1; }
      100% { transform: translate(-50%, -60%) rotate(0deg); opacity: 0; }
    }

    /* --- Cupboards and oven along the bottom --- */
    .cabinets {
      height: 108px;
      flex-shrink: 0;
      display: flex;
      border-top: 2.5px solid var(--ink);
      background: var(--wood-dark);
    }

    /* Powder-blue cupboard with two doors */
    .cupboard {
      flex: 1;
      display: flex;
      gap: 6px;
      padding: 8px;
      background: var(--cabinet);
    }

    .door {
      flex: 1;
      position: relative;
      border: 2.5px solid var(--ink);
      border-radius: 8px;
      background: var(--cabinet-light);
      box-shadow: inset 0 0 0 5px var(--cabinet);
    }

    /* Round peach knob on each door */
    .door::after {
      content: "";
      position: absolute;
      top: 40%;
      width: 10px;
      height: 10px;
      border-radius: 50%;
      background: var(--peach);
      border: 2px solid var(--ink);
    }

    .door:first-child::after { right: 6px; }
    .door:last-child::after { left: 6px; }

    /* The cream oven under the stove */
    .oven {
      width: 52%;
      margin-right: 10px;
      background: var(--stove);
      border-left: 2.5px solid var(--ink);
      border-right: 2.5px solid var(--ink);
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 4px 8px 8px;
      gap: 4px;
    }

    .knob-row {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    /* A small decorative knob */
    .knob {
      width: 16px;
      height: 16px;
      border-radius: 50%;
      background: white;
      border: 2px solid var(--ink);
    }

    /* The big "Cook" knob (a button): turning it lights the gas */
    .cook-knob {
      display: flex;
      align-items: center;
      gap: 4px;
      background: none;
      border: none;
      padding: 0;
      font-family: inherit;
      font-size: 12px;
      font-weight: 800;
      color: var(--text);
      touch-action: manipulation;
    }

    .cook-knob .dial {
      width: 30px;
      height: 30px;
      border-radius: 50%;
      background: var(--coral);
      border: 2.5px solid var(--ink);
      position: relative;
      transition: transform 0.4s ease;
    }

    /* The little line on the dial */
    .cook-knob .dial::after {
      content: "";
      position: absolute;
      left: 50%;
      top: 3px;
      width: 3px;
      height: 9px;
      margin-left: -1.5px;
      background: white;
      border-radius: 2px;
    }

    .cook-knob.on .dial {
      transform: rotate(120deg);
    }

    /* Oven door with a dark glass window and a handle */
    .oven-door {
      flex: 1;
      width: 100%;
      border: 2.5px solid var(--ink);
      border-radius: 8px;
      position: relative;
      background: #efe2c9;
      padding: 10px 12px 8px;
    }

    .oven-door::before {
      content: "";
      position: absolute;
      left: 20%;
      right: 20%;
      top: 3px;
      height: 5px;
      border-radius: 999px;
      background: var(--metal);
      border: 1.5px solid var(--ink);
    }

    .oven-glass {
      position: relative;
      height: 100%;
      border-radius: 6px;
      background: linear-gradient(135deg, #4a4545, #2e2a2a);
      border: 2px solid var(--ink);
      transition: background 0.6s, box-shadow 0.6s;
    }

    /* Baking: the oven glows warm orange inside */
    .oven-glass.baking {
      background: radial-gradient(ellipse, #ffc46b, #e8590c);
      box-shadow: 0 0 14px #ffa94d;
    }

    /* ============================================================
       THE COOKING STATION: where the bowl, pan or plate sits
       ============================================================ */
    .station {
      position: absolute;
      width: 140px;
      height: 96px;
      z-index: 3;
      touch-action: none;   /* stirring with a finger shouldn't scroll */
    }

    /* --- Mixing bowl --- */
    .bowl {
      position: absolute;
      left: 0;
      bottom: 0;
      width: 140px;
      height: 70px;
    }

    .bowl-body {
      position: absolute;
      bottom: 0;
      width: 100%;
      height: 58px;
      border: 2.5px solid var(--ink);
      border-top: none;
      border-radius: 0 0 70px 70px / 0 0 58px 58px;
      /* Peach bowl with a white band, like a pretty ceramic bowl */
      background:
        linear-gradient(90deg, rgba(255, 255, 255, 0) 15%, rgba(255, 255, 255, 0.55) 30%, rgba(255, 255, 255, 0) 45%),
        linear-gradient(var(--peach) 0 38%, #fff6ee 38% 52%, var(--peach) 52%);
    }

    .bowl-rim {
      position: absolute;
      top: 0;
      width: 100%;
      height: 22px;
      border: 2.5px solid var(--ink);
      border-radius: 50%;
      background: #e08e6d;   /* shadowy inside */
      z-index: 1;
    }

    .bowl-contents {
      position: absolute;
      top: 4px;
      left: 9%;
      width: 82%;
      height: 14px;
      border-radius: 50%;
      background: transparent;
      transition: background 0.5s;
      z-index: 2;
    }

    .bowl-items {
      position: absolute;
      top: -16px;
      left: 0;
      width: 100%;
      text-align: center;
      font-size: 24px;
      line-height: 1;
      z-index: 3;
      transition: opacity 0.3s;
    }

    .bowl-items span {
      display: inline-block;
      margin: 0 -3px;
    }

    .bowl.jiggle {
      animation: jiggle 0.35s ease;
    }

    @keyframes jiggle {
      30% { transform: scaleX(1.06) scaleY(0.94); }
      60% { transform: scaleX(0.97) scaleY(1.03); }
    }

    .bowl-items.swirl span {
      animation: spin 0.6s linear infinite;
    }

    @keyframes spin {
      to { transform: rotate(360deg); }
    }

    /* Glowing "touch me" hint */
    .hint {
      animation: hint 1s ease-in-out infinite;
    }

    @keyframes hint {
      0%, 100% { filter: drop-shadow(0 0 0 #ffd43b); }
      50% { filter: drop-shadow(0 0 10px #ffb700); }
    }

    .spoon {
      position: absolute;
      font-size: 34px;
      line-height: 1;
      pointer-events: none;
      transform: translate(-30%, -80%) rotate(-30deg);
      z-index: 6;
    }

    /* --- Sludge --- */
    .bowl.sludgy {
      animation: wobble 0.6s ease 2;
    }

    @keyframes wobble {
      25% { transform: rotate(-4deg); }
      75% { transform: rotate(4deg); }
    }

    .sludge-bubble {
      position: absolute;
      top: -6px;
      font-size: 15px;
      opacity: 0;
      z-index: 5;
      animation: rise 1.6s ease-in infinite;
    }

    @keyframes rise {
      0% { transform: translateY(0) scale(0.5); opacity: 0; }
      30% { opacity: 1; }
      100% { transform: translateY(-44px) scale(1.1); opacity: 0; }
    }

    /* --- Frying pan, sitting on the front burner --- */
    .pan {
      position: absolute;
      width: 90px;
      height: 40px;
      border: 2.5px solid #1d1d1d;
      border-radius: 50%;
      background: radial-gradient(ellipse at 50% 40%, #5c5c5c, #232323 70%);
      perspective: 300px;     /* makes the flip look 3D */
      z-index: 3;
      touch-action: manipulation;
    }

    /* Coral handle, like the pan in the picture */
    .pan::after {
      content: "";
      position: absolute;
      right: -24px;
      top: 22px;
      width: 30px;
      height: 10px;
      background: var(--coral);
      border: 2.5px solid var(--ink);
      border-radius: 6px;
      transform: rotate(18deg);
    }

    .pancake {
      position: absolute;
      left: 50%;
      top: 50%;
      width: 0;
      height: 0;
      transform: translate(-50%, -50%);
      border-radius: 50%;
      background: var(--batter);
      transition: width 0.8s ease-out, height 0.8s ease-out, background 2.4s;
    }

    .pancake.poured {
      width: 76%;
      height: 68%;
    }

    .pancake.cooking {
      background: radial-gradient(circle at 40% 40%, #f2c46d, #d99a3e);
    }

    .pancake.cooking::after {
      content: "";
      position: absolute;
      inset: 0;
      border-radius: 50%;
      background-image: radial-gradient(circle, rgba(255, 255, 255, 0.8) 1.5px, transparent 2px);
      background-size: 9px 7px;
      animation: sizzle 0.3s steps(2) infinite;
    }

    @keyframes sizzle {
      50% { opacity: 0.2; }
    }

    .pancake.flipping {
      animation: flip 0.8s ease-in-out forwards;
    }

    .pancake.flipping::after {
      display: none;
    }

    @keyframes flip {
      0%   { transform: translate(-50%, -50%) rotateX(0); }
      50%  { transform: translate(-50%, -240%) rotateX(100deg); }
      100% { transform: translate(-50%, -50%) rotateX(180deg); }
    }

    /* --- Plate with the finished dish --- */
    .plate {
      position: absolute;
      left: 6px;
      bottom: 2px;
      width: 128px;
      height: 28px;
      border: 2.5px solid var(--ink);
      border-radius: 50%;
      /* White plate with a pretty peach rim */
      background: radial-gradient(ellipse, #ffffff 48%, var(--peach) 52% 62%, #fff6ee 66%);
    }

    .plate-food {
      position: absolute;
      left: 0;
      right: 0;
      bottom: 6px;
      text-align: center;
      font-size: 58px;
      line-height: 1;
    }

    /* Stirring progress bar */
    .mix-bar {
      position: absolute;
      width: 130px;
      height: 10px;
      border: 2px solid var(--ink);
      border-radius: 999px;
      background: white;
      overflow: hidden;
      z-index: 4;
    }

    .mix-fill {
      height: 100%;
      width: 0;
      background: var(--green);
    }

    /* ============================================================
       PANTRY VIEW (behind you)
       ============================================================ */
    .pantry-view {
      background: var(--cream);
      padding: 10px 10px 0;
      overflow-y: auto;          /* scrolls on very small phones */
    }

    /* The big wooden cupboard */
    .cupboard-frame {
      border: 9px solid var(--wood);
      outline: 2.5px solid var(--ink);
      border-radius: 6px;
      padding: 6px 8px 0;
      margin: 2px;
      background-color: #fbf6ee;
      background-image:
        linear-gradient(#ece2d3 1.5px, transparent 1.5px),
        linear-gradient(90deg, #ece2d3 1.5px, transparent 1.5px);
      background-size: 30px 20px;
      box-shadow: inset 0 14px 18px rgba(0, 0, 0, 0.18), inset 10px 0 14px rgba(0, 0, 0, 0.08), inset -10px 0 14px rgba(0, 0, 0, 0.08);
    }

    /* Top shelf: decorations only (canisters, granola, plant) */
    .decor-row {
      display: flex;
      align-items: flex-end;
      justify-content: space-between;
      padding: 0 4px;
      height: 46px;
    }

    .canister {
      width: 34px;
      height: 32px;
      border: 2.5px solid var(--ink);
      border-radius: 6px;
      background: linear-gradient(90deg, #2a9d8f, #4fc1b2 40%, #2a9d8f);
      position: relative;
    }

    .canister::before {
      content: "";
      position: absolute;
      left: -3px;
      right: -3px;
      top: -7px;
      height: 7px;
      background: #24877b;
      border: 2.5px solid var(--ink);
      border-radius: 4px;
    }

    .decor-emoji {
      font-size: 30px;
      line-height: 1;
    }

    .shelf {
      margin-bottom: 10px;
    }

    .jar-row {
      display: grid;
      grid-template-columns: repeat(5, 1fr);
      gap: 5px;
      align-items: end;
      padding: 0 2px;
      perspective: 400px;
    }

    .plank {
      height: 15px;
      margin: 0 -8px;
      border-top: 2.5px solid var(--ink);
      border-bottom: 2.5px solid var(--ink);
      background:
        repeating-linear-gradient(90deg, rgba(0, 0, 0, 0.05) 0 2px, transparent 2px 26px),
        linear-gradient(var(--wood-light) 0 5px, var(--wood) 5px);
      box-shadow: 0 6px 8px rgba(0, 0, 0, 0.16);
    }

    /* A whole jar: lid + glass + shadow. It's really a button. */
    .jar-wrap {
      position: relative;
      background: none;
      border: none;
      padding: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      font-family: inherit;
      color: var(--text);
      touch-action: manipulation;
      transition: transform 0.25s ease, opacity 0.3s;
      transform-origin: bottom center;
    }

    .lid {
      width: 84%;
      height: 11px;
      border: 2.5px solid var(--ink);
      border-radius: 5px 5px 2px 2px;
      background:
        repeating-linear-gradient(90deg, rgba(0, 0, 0, 0.12) 0 2px, transparent 2px 6px),
        var(--lid);
      margin-bottom: -3px;
      position: relative;
      z-index: 1;
      transition: transform 0.25s ease;
    }

    .jar {
      position: relative;
      width: 100%;
      height: 66px;
      border: 2.5px solid var(--ink);
      border-radius: 10px 10px 12px 12px;
      background: rgba(225, 242, 246, 0.75);
      overflow: hidden;
    }

    .jar-wrap:nth-child(even) .jar {
      height: 58px;
    }

    .contents {
      position: absolute;
      left: 0;
      right: 0;
      bottom: 0;
      height: 72%;
      background-color: var(--fill);
      background-image:
        radial-gradient(circle, rgba(0, 0, 0, 0.13) 1.5px, transparent 2px),
        radial-gradient(circle, rgba(255, 255, 255, 0.45) 1.5px, transparent 2px);
      background-size: 8px 8px, 11px 9px;
      background-position: 0 0, 4px 3px;
      border-top: 2px solid rgba(0, 0, 0, 0.12);
    }

    .shine {
      position: absolute;
      left: 9%;
      top: 8%;
      width: 12%;
      height: 78%;
      border-radius: 999px;
      background: linear-gradient(rgba(255, 255, 255, 0.9), rgba(255, 255, 255, 0.2));
    }

    .label {
      position: absolute;
      left: 50%;
      top: 55%;
      transform: translate(-50%, -50%);
      background: white;
      border: 2px solid var(--ink);
      border-radius: 6px;
      padding: 1px 1px;
      display: flex;
      flex-direction: column;
      align-items: center;
      min-width: 86%;
    }

    .label .emoji {
      font-size: 17px;
      line-height: 1.1;
    }

    .label .name {
      font-size: 8.5px;
      font-weight: 800;
    }

    .jar-shadow {
      width: 90%;
      height: 6px;
      margin-top: -3px;
      border-radius: 50%;
      background: rgba(0, 0, 0, 0.25);
      transition: opacity 0.25s, transform 0.25s;
    }

    /* Picked up! Lifts, tilts towards you, lid pops */
    .jar-wrap.lifted {
      transform: translateY(-16px) rotateX(18deg) rotateZ(-10deg) scale(1.08);
    }

    .jar-wrap.lifted .lid {
      transform: translateY(-8px) rotate(-20deg);
    }

    .jar-wrap.lifted .jar-shadow {
      opacity: 0.3;
      transform: translateY(16px) scale(0.7);
    }

    .jar-wrap:disabled {
      opacity: 0.4;
    }

    /* Bottom of the pantry: a fruit basket and your bowl on a board */
    .pantry-floor {
      position: relative;
      height: 104px;
      margin-top: 6px;
    }

    .basket {
      position: absolute;
      left: 4px;
      bottom: 8px;
      width: 150px;
      height: 44px;
      border: 2.5px solid var(--ink);
      border-radius: 6px 6px 14px 14px;
      /* Woven wicker pattern */
      background:
        repeating-linear-gradient(45deg, rgba(0, 0, 0, 0.12) 0 3px, transparent 3px 8px),
        repeating-linear-gradient(-45deg, rgba(0, 0, 0, 0.08) 0 3px, transparent 3px 8px),
        #d8a868;
    }

    /* The row of fruit sitting in the basket */
    .basket-fruit {
      position: absolute;
      left: 0;
      right: 0;
      top: -30px;
      display: flex;
      justify-content: center;
    }

    /* One piece of fruit (a button you can tap) */
    .fruit {
      background: none;
      border: none;
      padding: 0;
      width: 29px;
      font-size: 26px;
      line-height: 1;
      font-family: inherit;
      touch-action: manipulation;
      transition: transform 0.25s ease, opacity 0.3s;
      filter: drop-shadow(1px 2px 0 rgba(0, 0, 0, 0.15));
    }

    /* Picked up out of the basket */
    .fruit.lifted {
      transform: translateY(-14px) scale(1.2) rotate(-12deg);
    }

    .fruit:disabled {
      opacity: 0.35;
    }

    /* The wooden board the bowl sits on in the pantry */
    .board {
      position: absolute;
      right: 4px;
      bottom: 0;
      width: 158px;
      height: 14px;
      border: 2.5px solid var(--ink);
      border-radius: 6px;
      background: var(--wood-light);
    }

    .board-label {
      position: absolute;
      right: 0;
      top: 0;
      font-size: 11px;
      font-weight: 800;
      opacity: 0.6;
    }

    /* ============================================================
       BOTTOM BAR: turn around, wash bowl, next customer
       ============================================================ */
    .bottom-bar {
      display: flex;
      gap: 8px;
    }

    .big-button {
      flex: 1;
      border: 2.5px solid var(--ink);
      border-radius: 16px;
      min-height: 54px;
      font-size: 18px;
      font-weight: 800;
      font-family: inherit;
      color: var(--text);
      background: white;
      box-shadow: 0 4px 0 var(--ink);
      touch-action: manipulation;
    }

    .big-button:active {
      transform: translateY(3px);
      box-shadow: 0 1px 0 var(--ink);
    }

    .turn-button { background: #fff6e8; }
    .wash-button { background: var(--blue); color: white; }
    .next-button { background: var(--green); color: white; }

    /* Gentle pulse on a button the player should tap next */
    .pulse {
      animation: pulse 1s ease-in-out infinite;
    }

    @keyframes pulse {
      50% { transform: scale(1.04); background: #ffe8a8; }
    }

    /* An emoji flying through the air */
    .flyer {
      position: fixed;
      z-index: 100;
      pointer-events: none;
      line-height: 1;
    }

    .hidden {
      display: none !important;
    }
  </style>
</head>

<body>
  <div class="game">

    <!-- ===== Top: coins and recipe card ===== -->
    <div class="hud">
      <div class="coins" id="coins-box">🪙 <span id="coins">0</span></div>
      <div class="recipe">
        <div class="recipe-title" id="recipe-title">🥞 Pancakes</div>
        <div class="recipe-slots">
          <span id="ingredient-slots"></span>
          <span>→</span>
          <span id="step-slots"></span>
        </div>
      </div>
    </div>

    <!-- ===== Friendly messages ===== -->
    <div class="message" id="message"></div>

    <!-- ===== The room: kitchen in front, pantry behind ===== -->
    <div class="viewport" id="viewport">
      <div class="room" id="room">

        <!-- ================= KITCHEN ================= -->
        <div class="view kitchen-view">
          <div class="wall">
            <div class="backsplash"></div>

            <!-- Cooker hood over the stove, and a shelf of pretty things -->
            <div class="hood"></div>
            <div class="wall-shelf">
              <div class="wall-shelf-items"><span>🫖</span><span style="font-size: 22px;">🏺</span><span style="font-size: 20px;">🧂</span></div>
              <div class="wall-shelf-plank"></div>
            </div>

            <!-- Serving hatch with the customer -->
            <div class="hatch" id="hatch">
              <div class="valance"></div>
              <div class="customer" id="customer">🧒</div>
            </div>
            <div class="sill" id="sill"></div>
            <div class="plant" id="plant">🪴</div>

            <!-- What the customer says -->
            <div class="bubble" id="bubble">I'd like pancakes, please! 🥞</div>

            <!-- Utensil rail: these tools are cooking steps -->
            <div class="rail" id="rail"></div>
            <div class="tools" id="tools"></div>
          </div>

          <div class="worktop" id="worktop">
            <div class="counter-top"></div>

            <!-- Stove top with a steaming pot and the frying pan -->
            <div class="stove-top" id="stove-top">
              <div class="burner back"></div>
              <div class="burner front"></div>
              <div class="flames hidden" id="flames">
                <span class="flame"></span><span class="flame"></span><span class="flame"></span>
              </div>
              <div class="flames back hidden" id="flames-back">
                <span class="flame"></span><span class="flame"></span><span class="flame"></span>
              </div>
            </div>
            <!-- The pot: tap it to Boil -->
            <div class="pot" id="pot">
              <span class="steam" style="left: 6px;"></span>
              <span class="steam" style="left: 26px; animation-delay: 0.8s;"></span>
              <span class="steam" style="left: 16px; animation-delay: 1.6s;"></span>
              <span class="appliance-tag">Boil</span>
            </div>
            <div class="pan" id="pan">
              <div class="pancake" id="pancake"></div>
            </div>

            <!-- The bowl / plate station on the counter -->
            <div class="station" id="kitchen-station">
              <div class="bowl"></div>
              <div class="hidden" id="plate">
                <div class="plate"></div>
                <div class="plate-food" id="plate-food">🥞</div>
              </div>
              <div class="spoon hidden" id="spoon">🥄</div>
            </div>
            <div class="mix-bar hidden" id="mix-bar"><div class="mix-fill" id="mix-fill"></div></div>
          </div>

          <!-- Cupboards and oven -->
          <div class="cabinets">
            <div class="cupboard">
              <div class="door"></div>
              <div class="door"></div>
            </div>
            <div class="oven">
              <div class="knob-row">
                <span class="knob"></span>
                <button class="cook-knob" id="cook-knob"><span class="dial"></span>Cook</button>
                <span class="knob"></span>
              </div>
              <!-- The oven door: tap it to Bake -->
              <div class="oven-door" id="oven-door">
                <div class="oven-glass" id="oven-glass"><span class="appliance-tag">Bake</span></div>
              </div>
            </div>
          </div>
        </div>

        <!-- ================= PANTRY ================= -->
        <div class="view pantry-view">
          <div class="cupboard-frame">
            <!-- Top shelf: just for looks -->
            <div class="decor-row">
              <span class="canister"></span>
              <span class="decor-emoji">🥣</span>
              <span class="canister"></span>
              <span class="decor-emoji">🪴</span>
            </div>
            <div class="plank" style="margin-bottom: 10px;"></div>

            <!-- Shelves of jars get added here by the code -->
            <div id="shelves"></div>
          </div>

          <!-- Fruit basket and your bowl -->
          <div class="pantry-floor">
            <div class="basket"><div class="basket-fruit" id="basket-fruit"></div></div>
            <div class="board"></div>
            <div class="station" id="pantry-station" style="right: 18px; bottom: 12px;">
              <div class="bowl"></div>
            </div>
          </div>
        </div>

      </div>
    </div>

    <!-- ===== Bottom bar ===== -->
    <div class="bottom-bar">
      <button class="big-button turn-button" id="turn-button">🔄 Pantry</button>
      <button class="big-button wash-button hidden" id="wash-button">🧽 Wash the bowl</button>
      <button class="big-button next-button hidden" id="next-button">Next customer ➡️</button>
    </div>

  </div>

  <script>
    // ============================================================
    // GAME DATA
    // Everything the game needs to know lives here, so it's easy
    // to change later (e.g. to add more dishes).
    // ============================================================

    // All the dishes customers can order.
    // - name: used in sentences ("I'd like pancakes")
    // - title: short name for the recipe card
    // - ingredients: what's needed from the pantry (any order)
    // - steps: what to do in the kitchen (this order!)
    // - colour: what the food in the bowl looks like once mixed or chopped
    const dishes = [
      {
        name: "pancakes", title: "Pancakes", emoji: "🥞",
        ingredients: ["Flour", "Eggs", "Milk"],
        steps: ["Mix", "Cook"],
        colour: "#f6e3b4"
      },
      {
        name: "pasta with tomato sauce", title: "Pasta", emoji: "🍝",
        ingredients: ["Pasta", "Tomato", "Garlic"],
        steps: ["Chop", "Boil"],
        colour: "#e4572e"
      },
      {
        name: "a salad", title: "Salad", emoji: "🥗",
        ingredients: ["Lettuce", "Tomato", "Cucumber"],
        steps: ["Chop", "Mix"],
        colour: "#8fce7c"
      },
      // Pie is special: it comes in different fruit flavours (see makePie below)
      { isPie: true },
      {
        name: "a cup of tea", title: "Tea", emoji: "🍵",
        ingredients: ["Tea", "Honey"],
        steps: ["Boil"],
        colour: "#c58b4c"
      }
    ];

    // Everything in the pantry. Each dish needs some of these;
    // the rest are distractors. "fill" is the colour of the food in the jar.
    const pantryItems = [
      { name: "Flour",    emoji: "🌾", fill: "#f3ead8" },
      { name: "Eggs",     emoji: "🥚", fill: "#f6e2c3" },
      { name: "Milk",     emoji: "🥛", fill: "#ffffff" },
      { name: "Pasta",    emoji: "🍝", fill: "#f5d78e" },
      { name: "Tomato",   emoji: "🍅", fill: "#f28b82" },
      { name: "Garlic",   emoji: "🧄", fill: "#efe6d8" },
      { name: "Lettuce",  emoji: "🥬", fill: "#a8d98a" },
      { name: "Cucumber", emoji: "🥒", fill: "#7cbf6a" },
      { name: "Butter",   emoji: "🧈", fill: "#fbe58c" },
      { name: "Rice",     emoji: "🍚", fill: "#f7f7f2" },
      { name: "Tea",      emoji: "🍃", fill: "#8c9a5b" },
      { name: "Honey",    emoji: "🍯", fill: "#f2b33d" },
      { name: "Fish",     emoji: "🐟", fill: "#a7d3f0" },
      { name: "Onion",    emoji: "🧅", fill: "#e9c9a3" },
      { name: "Cheese",   emoji: "🧀", fill: "#ffd966" },
      { name: "Carrot",   emoji: "🥕", fill: "#ffb26b" },
      { name: "Chilli",   emoji: "🌶️", fill: "#e85d4a" },
      { name: "Mushroom", emoji: "🍄", fill: "#d9b99b" },
      { name: "Potato",   emoji: "🥔", fill: "#d8b07a" },
      { name: "Lemon",    emoji: "🍋", fill: "#fff176" }
    ];

    // Fruit in the basket at the bottom of the pantry. These are ingredients too!
    // "fill" is the colour the pie filling turns when mixed.
    const basketFruits = [
      { name: "Apple",  emoji: "🍎", fill: "#f3d9a0" },
      { name: "Orange", emoji: "🍊", fill: "#f9b45c" },
      { name: "Banana", emoji: "🍌", fill: "#f7e38a" },
      { name: "Pear",   emoji: "🍐", fill: "#d8e08a" },
      { name: "Grape",  emoji: "🍇", fill: "#a77bc9" }
    ];

    // Every ingredient, from the jars and the basket together
    const allIngredients = pantryItems.concat(basketFruits);

    // Find an ingredient by its name, e.g. findIngredient("Flour")
    function findIngredient(name) {
      return allIngredients.find(function (item) { return item.name === name; });
    }

    // Make a pie recipe for one fruit, e.g. makePie(basketFruits[2]) = banana pie
    function makePie(fruit) {
      // "an" before a vowel sound: an apple pie, an orange pie, a pear pie
      const startsWithVowel = "AEIOU".includes(fruit.name[0]);
      return {
        name: (startsWithVowel ? "an " : "a ") + fruit.name.toLowerCase() + " pie",
        title: fruit.name + " Pie",
        emoji: "🥧",
        ingredients: ["Flour", "Butter", fruit.name],
        steps: ["Mix", "Bake"],
        colour: fruit.fill
      };
    }

    // Lid colours for the jars (picked at random for each jar)
    const lidColours = ["#2a9d8f", "#dca56e", "#e9c46a", "#e9735b", "#92b4d4"];

    // How many jars fit on one shelf
    const jarsPerShelf = 5;

    // Tools hanging on the kitchen rail.
    // (The other steps are on the stove: Cook = knob, Boil = pot, Bake = oven door.)
    const railTools = [
      { name: "Mix",  emoji: "🥄" },
      { name: "Chop", emoji: "🔪" }
    ];

    // Emoji shown on the recipe card when a step is done
    const stepEmoji = { Mix: "🥄", Chop: "🔪", Cook: "🍳", Boil: "♨️", Bake: "🔥" };

    // Words for friendly messages ("No chopping needed!")
    const stepWords = { Mix: "mixing", Chop: "chopping", Cook: "frying", Boil: "boiling", Bake: "baking" };

    // How many taps it takes to chop everything
    const chopTarget = 8;

    // Different faces so each customer feels new
    const customerFaces = ["🧒", "👧", "👦", "👩", "👨", "👵", "👴", "🧑‍🦰"];

    // How many coins a finished dish earns
    const coinsPerDish = 10;

    // How much finger-swirling counts as "fully mixed" (in pixels moved)
    const stirTarget = 1200;

    // ============================================================
    // GAME STATE
    // These change as the player plays.
    // ============================================================

    let coins = 0;
    let addedIngredients = [];   // ingredients put in the bowl so far
    let stepsDone = 0;           // how many cooking steps finished so far
    let currentDish = null;      // the dish being made (picked when a customer arrives)
    let lastMenuItem = null;     // what was picked from the dishes list last time
    let currentFace = "🧒";      // the face of the customer being served
    let facing = "kitchen";      // which way you're looking: "kitchen" or "pantry"

    // What's happening right now. This stops taps doing the wrong thing.
    // "pick" = choosing ingredients, "busy" = an animation is playing,
    // "steps" = time to cook, "stirring", "chopping", "cooking", "flip",
    // "sludge", "served"
    let stage = "pick";

    // For stirring: how far the finger has moved, and where it was last
    let stirDistance = 0;
    let lastPoint = null;

    // For chopping: how many chops so far
    let chopCount = 0;

    // ============================================================
    // GRAB THE PARTS OF THE PAGE WE NEED TO CHANGE
    // ============================================================

    const coinsText = document.getElementById("coins");
    const coinsBox = document.getElementById("coins-box");
    const recipeTitle = document.getElementById("recipe-title");
    const ingredientSlots = document.getElementById("ingredient-slots");
    const stepSlots = document.getElementById("step-slots");
    const message = document.getElementById("message");
    const viewport = document.getElementById("viewport");
    const room = document.getElementById("room");
    const customerFace = document.getElementById("customer");
    const bubble = document.getElementById("bubble");
    const toolsBox = document.getElementById("tools");
    const kitchenStation = document.getElementById("kitchen-station");
    const pantryStation = document.getElementById("pantry-station");
    const plate = document.getElementById("plate");
    const plateFood = document.getElementById("plate-food");
    const spoon = document.getElementById("spoon");
    const mixBar = document.getElementById("mix-bar");
    const mixFill = document.getElementById("mix-fill");
    const pan = document.getElementById("pan");
    const pancake = document.getElementById("pancake");
    const flames = document.getElementById("flames");
    const flamesBack = document.getElementById("flames-back");
    const cookKnob = document.getElementById("cook-knob");
    const pot = document.getElementById("pot");
    const ovenDoor = document.getElementById("oven-door");
    const ovenGlass = document.getElementById("oven-glass");
    const shelves = document.getElementById("shelves");
    const basket = document.getElementById("basket-fruit");
    const turnButton = document.getElementById("turn-button");
    const washButton = document.getElementById("wash-button");
    const nextButton = document.getElementById("next-button");

    // ============================================================
    // LAYOUT
    // Some things are positioned by code, because they depend on
    // the size of the phone screen.
    // ============================================================

    function layoutKitchen() {
      const hatch = document.getElementById("hatch");
      const sill = document.getElementById("sill");
      const plant = document.getElementById("plant");
      const rail = document.getElementById("rail");
      const stoveTop = document.getElementById("stove-top");

      // Sill sits just under the hatch, plant sits on the sill
      const hatchBottom = hatch.offsetTop + hatch.offsetHeight;
      sill.style.top = (hatchBottom - 2) + "px";
      plant.style.top = (hatchBottom - 30) + "px";
      plant.style.left = (hatch.offsetLeft + hatch.offsetWidth - 18) + "px";

      // Rail goes under the speech bubble, tools hang from it
      const railTop = bubble.offsetTop + bubble.offsetHeight + 14;
      rail.style.top = railTop + "px";
      toolsBox.style.top = (railTop + 4) + "px";

      // Pot on the back burner, pan on the front burner
      const stoveLeft = stoveTop.offsetLeft;
      const stoveWidth = stoveTop.offsetWidth;
      pot.style.left = (stoveLeft + 14) + "px";
      pan.style.left = (stoveLeft + stoveWidth - 90 - 26) + "px";
      pan.style.bottom = "14px";

      // Bowl on the counter, on the left
      kitchenStation.style.left = "12px";
      kitchenStation.style.bottom = "12px";
      mixBar.style.left = "17px";
      mixBar.style.bottom = "4px";
    }

    // ============================================================
    // HELPER FUNCTIONS
    // ============================================================

    // Shuffle a list into a random order (so things move around each round)
    function shuffle(list) {
      const copy = list.slice();
      for (let i = copy.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [copy[i], copy[j]] = [copy[j], copy[i]];
      }
      return copy;
    }

    // Pick one random thing from a list
    function randomFrom(list) {
      return list[Math.floor(Math.random() * list.length)];
    }

    // Change what the customer says (and move the rail if the bubble changes size)
    function setBubble(text) {
      bubble.textContent = text;
      layoutKitchen();
    }

    // Show a message. type is "good" (green) or "oops" (orange).
    function showMessage(text, type) {
      message.textContent = text;
      message.className = "message " + (type || "");
    }

    // Play an animation by adding a class, then remove it so it can play again
    function playAnimation(element, className) {
      element.classList.remove(className);
      void element.offsetWidth;   // tiny trick that "resets" the animation
      element.classList.add(className);
    }

    // Make an emoji fly in an arc from one thing on the page to another.
    // When it lands, the function "onLand" is run.
    function fly(emoji, fromElement, toElement, size, onLand) {
      const from = fromElement.getBoundingClientRect();
      const to = toElement.getBoundingClientRect();

      const startX = from.left + from.width / 2;
      const startY = from.top + from.height / 2;
      const moveX = to.left + to.width / 2 - startX;
      const moveY = to.top + to.height / 2 - startY;

      const flyer = document.createElement("span");
      flyer.className = "flyer";
      flyer.textContent = emoji;
      flyer.style.left = startX + "px";
      flyer.style.top = startY + "px";
      flyer.style.fontSize = size + "px";
      document.body.appendChild(flyer);

      // Start -> up high in the middle -> land at the end
      const animation = flyer.animate([
        { transform: "translate(-50%, -50%) scale(1) rotate(0deg)" },
        { transform: "translate(calc(-50% + " + moveX / 2 + "px), calc(-50% + " + (moveY / 2 - 90) + "px)) scale(1.4) rotate(180deg)", offset: 0.5 },
        { transform: "translate(calc(-50% + " + moveX + "px), calc(-50% + " + moveY + "px)) scale(0.8) rotate(360deg)" }
      ], { duration: 650, easing: "ease-in-out" });

      animation.onfinish = function () {
        flyer.remove();
        onLand();
      };
    }

    // ============================================================
    // SOUND EFFECTS
    // Made by the browser itself, so there are no sound files.
    // (On iPhone, sounds are silent if the ring/silent switch is on silent.)
    // ============================================================

    let audio = null;

    function playSound(kind) {
      // Each sound: [start pitch, end pitch, length in seconds, wave shape]
      const sounds = {
        plop:   [520, 260, 0.15, "sine"],
        ding:   [880, 1400, 0.3, "sine"],
        blorp:  [200, 60, 0.6, "sawtooth"],
        whoosh: [300, 900, 0.25, "triangle"],
        pour:   [180, 420, 0.5, "sine"],
        click:  [1200, 800, 0.05, "square"],
        chop:   [900, 300, 0.07, "square"]
      };
      const sound = sounds[kind];

      try {
        // The audio system can only be started after the player taps something
        if (!audio) {
          audio = new (window.AudioContext || window.webkitAudioContext)();
        }
        const now = audio.currentTime;
        const tone = audio.createOscillator();
        const volume = audio.createGain();
        tone.type = sound[3];
        tone.frequency.setValueAtTime(sound[0], now);
        tone.frequency.exponentialRampToValueAtTime(sound[1], now + sound[2]);
        volume.gain.setValueAtTime(0.15, now);
        volume.gain.exponentialRampToValueAtTime(0.001, now + sound[2]);
        tone.connect(volume);
        volume.connect(audio.destination);
        tone.start(now);
        tone.stop(now + sound[2]);
      } catch (error) {
        // If sound doesn't work, the game carries on silently
      }
    }

    // ============================================================
    // THE BOWL
    // There are two bowls on screen (one in the kitchen, one in the
    // pantry), but they're really the same bowl you carry around.
    // These functions keep both looking the same.
    // ============================================================

    // Draw the inside of a bowl (called once for each bowl)
    function buildBowl(bowlElement) {
      bowlElement.innerHTML =
        '<div class="bowl-body"></div>' +
        '<div class="bowl-rim"></div>' +
        '<div class="bowl-contents"></div>' +
        '<div class="bowl-items"></div>';
    }

    function allBowls() {
      return document.querySelectorAll(".bowl");
    }

    // The bowl you can see right now (for animations to fly to)
    function visibleBowl() {
      const station = facing === "pantry" ? pantryStation : kitchenStation;
      return station.querySelector(".bowl");
    }

    // Put emoji in both bowls
    function setBowlItems(html) {
      document.querySelectorAll(".bowl-items").forEach(function (items) {
        items.innerHTML = html;
        items.style.opacity = 1;
      });
    }

    // Change the colour of what's inside both bowls
    function setBowlContents(colour) {
      document.querySelectorAll(".bowl-contents").forEach(function (contents) {
        contents.style.background = colour;
      });
    }

    // Turn sludge on or off in both bowls
    function setSludge(on) {
      allBowls().forEach(function (bowl) {
        bowl.classList.toggle("sludgy", on);
        bowl.querySelectorAll(".sludge-bubble").forEach(function (b) { b.remove(); });
        if (on) {
          // Three bubbles that keep rising out of the sludge
          for (let i = 0; i < 3; i++) {
            const sludgeBubble = document.createElement("span");
            sludgeBubble.className = "sludge-bubble";
            sludgeBubble.textContent = "🫧";
            sludgeBubble.style.left = (22 + i * 34) + "px";
            sludgeBubble.style.animationDelay = (i * 0.5) + "s";
            bowl.appendChild(sludgeBubble);
          }
        }
      });
    }

    // ============================================================
    // THE RECIPE CARD
    // Empty boxes that fill up as you go, so you know how many
    // ingredients and steps are needed (but not which ones!).
    // ============================================================

    function updateRecipeCard() {
      recipeTitle.textContent = currentDish.emoji + " " + currentDish.title;

      let html = "";
      for (let i = 0; i < currentDish.ingredients.length; i++) {
        const name = addedIngredients[i];
        if (name) {
          html += '<span class="slot filled">' + findIngredient(name).emoji + "</span>";
        } else {
          html += '<span class="slot"></span>';
        }
      }
      ingredientSlots.innerHTML = html;
      ingredientSlots.style.display = "flex";
      ingredientSlots.style.gap = "4px";

      html = "";
      for (let i = 0; i < currentDish.steps.length; i++) {
        if (i < stepsDone) {
          html += '<span class="slot filled">' + stepEmoji[currentDish.steps[i]] + "</span>";
        } else {
          html += '<span class="slot"></span>';
        }
      }
      stepSlots.innerHTML = html;
      stepSlots.style.display = "flex";
      stepSlots.style.gap = "4px";
    }

    // ============================================================
    // TURNING AROUND (kitchen <-> pantry)
    // ============================================================

    // You can only turn around when you're not in the middle of something
    function canTurn() {
      return stage === "pick" || stage === "steps";
    }

    function turnAround() {
      if (!canTurn()) return;
      facing = facing === "kitchen" ? "pantry" : "kitchen";
      room.classList.toggle("facing-pantry", facing === "pantry");
      playAnimation(viewport, "turning");
      turnButton.textContent = facing === "kitchen" ? "🔄 Pantry" : "🔄 Kitchen";
      turnButton.classList.remove("pulse");

      // Helpful message for where you've turned to
      if (facing === "pantry" && stage === "pick") {
        showMessage("Tap the jars and fruit to put ingredients in your bowl", "");
      } else if (facing === "kitchen" && stage === "steps") {
        showMessage("Now cook! Use the right things in the right order 👩‍🍳", "");
      } else if (facing === "kitchen" && stage === "pick") {
        showMessage("Your bowl needs ingredients from the pantry 🔄", "");
      }
    }

    turnButton.addEventListener("click", turnAround);

    // You can also swipe left/right to turn around
    let swipeStart = null;
    viewport.addEventListener("touchstart", function (event) {
      // Don't count stirring as a swipe
      if (event.target.closest(".station")) return;
      swipeStart = { x: event.touches[0].clientX, y: event.touches[0].clientY };
    });
    viewport.addEventListener("touchend", function (event) {
      if (!swipeStart) return;
      const moveX = event.changedTouches[0].clientX - swipeStart.x;
      const moveY = event.changedTouches[0].clientY - swipeStart.y;
      swipeStart = null;
      // A clear sideways swipe of at least 60 pixels
      if (Math.abs(moveX) > 60 && Math.abs(moveX) > Math.abs(moveY)) {
        if (moveX < 0 && facing === "kitchen") turnAround();
        if (moveX > 0 && facing === "pantry") turnAround();
      }
    });

    // ============================================================
    // BUILDING THE PANTRY AND THE TOOLS
    // ============================================================

    // Make one glass jar for the pantry shelf
    function makeJar(item) {
      const jar = document.createElement("button");
      jar.className = "jar-wrap";
      jar.style.setProperty("--fill", item.fill);
      jar.style.setProperty("--lid", randomFrom(lidColours));
      jar.innerHTML =
        '<span class="lid"></span>' +
        '<span class="jar">' +
          '<span class="contents"></span>' +
          '<span class="shine"></span>' +
          '<span class="label"><span class="emoji">' + item.emoji + '</span><span class="name">' + item.name + "</span></span>" +
        "</span>" +
        '<span class="jar-shadow"></span>';
      jar.addEventListener("click", function () {
        tapIngredient(item, jar);
      });
      return jar;
    }

    // Fill the pantry with shelves of jars, in a random order
    function buildPantry() {
      shelves.innerHTML = "";
      const jars = shuffle(pantryItems);
      for (let i = 0; i < jars.length; i += jarsPerShelf) {
        const shelf = document.createElement("div");
        shelf.className = "shelf";
        const row = document.createElement("div");
        row.className = "jar-row";
        jars.slice(i, i + jarsPerShelf).forEach(function (item) {
          row.appendChild(makeJar(item));
        });
        const plank = document.createElement("div");
        plank.className = "plank";
        shelf.appendChild(row);
        shelf.appendChild(plank);
        shelves.appendChild(shelf);
      }

      // Put the fruit in the basket, as tappable buttons
      basket.innerHTML = "";
      shuffle(basketFruits).forEach(function (fruit) {
        const button = document.createElement("button");
        button.className = "fruit";
        button.innerHTML = '<span class="emoji">' + fruit.emoji + "</span>";
        button.addEventListener("click", function () {
          tapIngredient(fruit, button);
        });
        basket.appendChild(button);
      });
    }

    // Turn all the jars and fruit on or off at once
    function setJarsEnabled(enabled) {
      document.querySelectorAll("#shelves button, .fruit").forEach(function (button) {
        button.disabled = !enabled;
      });
    }

    // Hang the tools on the rail, in a random order
    function buildTools() {
      toolsBox.innerHTML = "";
      shuffle(railTools).forEach(function (tool) {
        const button = document.createElement("button");
        button.className = "tool";
        button.innerHTML =
          '<span class="hook"></span>' +
          '<span class="tool-emoji">' + tool.emoji + "</span>" +
          '<span class="tag">' + tool.name + "</span>";
        button.addEventListener("click", function () {
          tapStep(tool.name, button);
        });
        toolsBox.appendChild(button);
      });
    }

    // ============================================================
    // STAGE 1: PICKING INGREDIENTS (in the pantry)
    // ============================================================

    function tapIngredient(item, jar) {
      if (stage !== "pick") return;
      stage = "busy";

      // Lift the jar off the shelf, and send the ingredient flying to the bowl
      jar.classList.add("lifted");
      const bowl = visibleBowl();
      fly(item.emoji, jar.querySelector(".emoji"), bowl.querySelector(".bowl-items"), 28, function () {
        jar.classList.remove("lifted");

        if (currentDish.ingredients.includes(item.name)) {
          // Right ingredient: it lands in the bowl
          addedIngredients.push(item.name);
          setBowlItems(addedIngredients.map(function (name) {
            return "<span>" + findIngredient(name).emoji + "</span>";
          }).join(""));
          setBowlContents("#fffaf0");
          jar.disabled = true;
          playAnimation(bowl, "jiggle");
          playSound("plop");
          updateRecipeCard();

          if (addedIngredients.length === currentDish.ingredients.length) {
            // Got everything!
            stage = "steps";
            showMessage("All in! Turn around to the kitchen to cook 🔄", "good");
            turnButton.classList.add("pulse");
          } else {
            showMessage("Yum, " + item.name.toLowerCase() + "! 👍", "good");
            stage = "pick";
          }
        } else {
          // Wrong ingredient: it ruins everything!
          makeSludge(item);
        }
      });
    }

    // A wrong ingredient turns the bowl into sludge
    function makeSludge(item) {
      stage = "sludge";
      setBowlItems("<span>🤢</span>");
      setBowlContents("var(--sludge)");
      setSludge(true);
      playSound("blorp");

      customerFace.textContent = "😖";
      setBubble("Eww! That's not " + currentDish.name + "!");
      showMessage("Oh no, the " + item.name.toLowerCase() + " turned it into sludge! 🤢", "oops");

      // No more ingredients until the bowl is clean
      setJarsEnabled(false);
      turnButton.classList.add("hidden");
      washButton.classList.remove("hidden");
    }

    // Empty the bowl and start picking ingredients again (same customer)
    function washBowl() {
      addedIngredients = [];
      setBowlItems("");
      setBowlContents("transparent");
      setSludge(false);
      updateRecipeCard();

      customerFace.textContent = currentFace;
      setBubble("I'd like " + currentDish.name + ", please! " + currentDish.emoji);
      showMessage("All clean! Tap the jars to try again", "");

      setJarsEnabled(true);
      washButton.classList.add("hidden");
      turnButton.classList.remove("hidden");
      stage = "pick";
    }

    // ============================================================
    // STAGE 2: COOKING (in the kitchen)
    // The steps are real things in the kitchen:
    //   Mix  = the spoon on the rail     Chop = the knife on the rail
    //   Cook = the red knob (frying pan) Boil = the pot
    //   Bake = the oven door
    // ============================================================

    function tapStep(name, element) {
      // Not got the ingredients yet?
      if (stage === "pick") {
        showMessage("First get the ingredients from the pantry! 🔄", "oops");
        playAnimation(element, "shake");
        return;
      }
      if (stage !== "steps") return;

      const nextStep = currentDish.steps[stepsDone];

      if (name !== nextStep) {
        // Wrong step: a friendly nudge
        if (currentDish.steps.includes(name)) {
          showMessage("Hmm, not yet! What do we do first? 🤔", "oops");
        } else {
          showMessage("No " + stepWords[name] + " needed for " + currentDish.name + "! 😊", "oops");
        }
        playAnimation(element, "shake");
        return;
      }

      // Right step! Tools on the rail get taken down.
      if (element.classList.contains("tool")) {
        element.classList.add("used");
      }
      if (name === "Mix") startStirring();
      if (name === "Chop") startChopping();
      if (name === "Cook") startCooking();
      if (name === "Boil") startBoiling();
      if (name === "Bake") startBaking();
    }

    // The stove and oven are steps too
    cookKnob.addEventListener("click", function () { tapStep("Cook", cookKnob); });
    pot.addEventListener("click", function () { tapStep("Boil", pot); });
    ovenDoor.addEventListener("click", function () { tapStep("Bake", ovenDoor); });

    // Called when a step is finished. "source" is where the food is now
    // (bowl, pan, pot or oven), so the finished dish can fly from there.
    function stepDone(source) {
      stepsDone++;
      updateRecipeCard();
      if (stepsDone === currentDish.steps.length) {
        serveDish(source);
      } else {
        stage = "steps";
      }
    }

    // ----- CHOP: tap the bowl lots of times -----

    function startChopping() {
      stage = "chopping";
      chopCount = 0;
      mixFill.style.width = "0%";
      mixBar.classList.remove("hidden");
      kitchenStation.classList.add("hint");
      showMessage("Chop chop! Tap the bowl lots of times 🔪", "good");
    }

    // One chop: a knife swings down where you tapped
    function chop(event) {
      chopCount++;
      kitchenStation.classList.remove("hint");
      playSound("chop");

      const box = kitchenStation.getBoundingClientRect();
      const knife = document.createElement("span");
      knife.className = "chop-knife";
      knife.textContent = "🔪";
      knife.style.left = (event.clientX - box.left) + "px";
      knife.style.top = (event.clientY - box.top) + "px";
      kitchenStation.appendChild(knife);
      setTimeout(function () { knife.remove(); }, 300);

      // Food gets chopped smaller and smaller
      const progress = Math.min(chopCount / chopTarget, 1);
      mixFill.style.width = (progress * 100) + "%";
      kitchenStation.querySelectorAll(".bowl-items span").forEach(function (item) {
        item.style.transform = "scale(" + (1 - progress * 0.6) + ")";
      });
      playAnimation(kitchenStation.querySelector(".bowl"), "jiggle");

      if (chopCount >= chopTarget) {
        stage = "busy";
        setTimeout(function () {
          setBowlItems("");
          setBowlContents(currentDish.colour);   // nicely chopped!
          mixBar.classList.add("hidden");
          playSound("ding");
          showMessage("All chopped! What's next? 👍", "good");
          stepDone(kitchenStation);
        }, 300);
      }
    }

    // ----- MIX: stir the bowl with your finger -----

    function startStirring() {
      stage = "stirring";
      stirDistance = 0;
      mixFill.style.width = "0%";
      mixBar.classList.remove("hidden");
      kitchenStation.classList.add("hint");
      showMessage("Stir! Swirl your finger round and round the bowl 🥄", "good");
    }

    kitchenStation.addEventListener("pointerdown", function (event) {
      if (stage === "chopping") {
        chop(event);
        return;
      }
      if (stage !== "stirring") return;
      lastPoint = { x: event.clientX, y: event.clientY };
      spoon.classList.remove("hidden");
      moveSpoon(event);
      kitchenStation.querySelector(".bowl-items").classList.add("swirl");
      kitchenStation.classList.remove("hint");
    });

    kitchenStation.addEventListener("pointermove", function (event) {
      if (stage !== "stirring" || !lastPoint) return;
      const moved = Math.hypot(event.clientX - lastPoint.x, event.clientY - lastPoint.y);
      lastPoint = { x: event.clientX, y: event.clientY };
      stirDistance += moved;
      moveSpoon(event);

      // Bar fills up, batter appears, lumpy bits fade away
      const progress = Math.min(stirDistance / stirTarget, 1);
      mixFill.style.width = (progress * 100) + "%";
      kitchenStation.querySelector(".bowl-items").style.opacity = 1 - progress;
      if (progress > 0.3) setBowlContents(currentDish.colour);

      if (progress >= 1) finishStirring();
    });

    function stopStirring() {
      lastPoint = null;
      spoon.classList.add("hidden");
      kitchenStation.querySelector(".bowl-items").classList.remove("swirl");
    }
    kitchenStation.addEventListener("pointerup", stopStirring);
    kitchenStation.addEventListener("pointercancel", stopStirring);
    kitchenStation.addEventListener("pointerleave", stopStirring);

    function moveSpoon(event) {
      const box = kitchenStation.getBoundingClientRect();
      spoon.style.left = (event.clientX - box.left) + "px";
      spoon.style.top = (event.clientY - box.top) + "px";
    }

    function finishStirring() {
      stopStirring();
      stage = "busy";
      setBowlItems("");
      mixBar.classList.add("hidden");
      playSound("ding");
      showMessage("All mixed! What's next? 👍", "good");
      stepDone(kitchenStation);
    }

    // ----- COOK: turn the knob, pour, wait till golden, flip -----

    function startCooking() {
      stage = "cooking";
      cookKnob.classList.add("on");
      flames.classList.remove("hidden");
      playSound("click");

      // Batter goes from the bowl into the pan
      setBowlContents("transparent");
      pancake.className = "pancake";
      showMessage("Pouring the batter... 🔥", "good");
      playSound("pour");

      setTimeout(function () { pancake.classList.add("poured"); }, 50);
      setTimeout(function () {
        pancake.classList.add("cooking");
        showMessage("Sizzle sizzle... wait for it! 🔥", "good");
      }, 900);

      // Once golden, it's ready to flip
      setTimeout(function () {
        stage = "flip";
        pan.classList.add("hint");
        showMessage("Golden underneath! Tap the pan to flip it! 👆", "good");
      }, 3400);
    }

    pan.addEventListener("click", function () {
      if (stage !== "flip") return;
      stage = "busy";
      pan.classList.remove("hint");
      pancake.classList.add("flipping");
      playSound("whoosh");
    });

    // When the flip finishes: gas off, cooking done
    pancake.addEventListener("animationend", function (event) {
      if (event.animationName !== "flip") return;
      cookKnob.classList.remove("on");
      flames.classList.add("hidden");
      pancake.className = "pancake";
      stepDone(pan);
    });

    // ----- BOIL: the food goes into the pot and bubbles away -----

    function startBoiling() {
      stage = "busy";
      flamesBack.classList.remove("hidden");
      playSound("click");

      // Whatever is in the bowl flies into the pot
      fly(currentDish.emoji, kitchenStation, pot, 30, function () {
        setBowlItems("");
        setBowlContents("transparent");
        pot.classList.add("boiling");
        playSound("pour");
        showMessage("Bubble bubble... boiling! ♨️", "good");

        setTimeout(function () {
          pot.classList.remove("boiling");
          flamesBack.classList.add("hidden");
          playSound("ding");
          showMessage("Boiled to perfection! 👍", "good");
          stepDone(pot);
        }, 2600);
      });
    }

    // ----- BAKE: into the oven until it's done -----

    function startBaking() {
      stage = "busy";
      const ovenTag = ovenGlass.querySelector(".appliance-tag");

      // Whatever is in the bowl flies into the oven
      fly(currentDish.emoji, kitchenStation, ovenGlass, 30, function () {
        setBowlItems("");
        setBowlContents("transparent");
        ovenGlass.classList.add("baking");
        ovenTag.textContent = currentDish.emoji;   // you can see it through the glass

        // Count down: 3... 2... 1...
        let secondsLeft = 3;
        showMessage("Baking... " + secondsLeft + " 🔥", "good");
        const timer = setInterval(function () {
          secondsLeft--;
          if (secondsLeft > 0) {
            showMessage("Baking... " + secondsLeft + " 🔥", "good");
            playSound("click");
          } else {
            clearInterval(timer);
            ovenGlass.classList.remove("baking");
            ovenTag.textContent = "Bake";
            playSound("ding");
            showMessage("Ding! Golden and crispy! 👍", "good");
            stepDone(ovenGlass);
          }
        }, 1000);
      });
    }

    // ============================================================
    // STAGE 3: SERVE THE DISH AND GET PAID
    // ============================================================

    // "source" is where the finished food is coming from (pan, pot, oven or bowl)
    function serveDish(source) {
      stage = "served";

      // The finished dish flies onto a plate on the counter
      fly(currentDish.emoji, source, kitchenStation, 40, function () {
        kitchenStation.querySelector(".bowl").classList.add("hidden");
        plateFood.textContent = currentDish.emoji;
        plate.classList.remove("hidden");
        getPaid();
      });
    }

    function getPaid() {
      customerFace.textContent = "😄";
      customerFace.classList.add("bounce");
      setBubble("Delicious! Thank you! 💖");
      showMessage("+" + coinsPerDish + " coins! 🪙", "good");
      playSound("ding");

      // Three coins fly from the plate to the coin counter
      for (let i = 0; i < 3; i++) {
        setTimeout(function () {
          fly("🪙", plateFood, coinsBox, 26, function () {
            playAnimation(coinsBox, "pop");
            playSound("plop");
            if (i === 2) {
              coins += coinsPerDish;
              coinsText.textContent = coins;
            }
          });
        }, i * 200);
      }

      turnButton.classList.add("hidden");
      nextButton.classList.remove("hidden");
    }

    // ============================================================
    // START A NEW ROUND (a new customer arrives)
    // ============================================================

    function newCustomer() {
      stepsDone = 0;
      currentFace = randomFrom(customerFaces);

      // Pick a dish (a different one from last time, to keep it fresh)
      let menuItem = randomFrom(dishes);
      while (menuItem === lastMenuItem) {
        menuItem = randomFrom(dishes);
      }
      lastMenuItem = menuItem;

      // If it's pie, pick a fruit flavour too
      if (menuItem.isPie) {
        currentDish = makePie(randomFrom(basketFruits));
      } else {
        currentDish = menuItem;
      }

      buildPantry();
      buildTools();
      washBowl();

      // Plate away, bowl back
      plate.classList.add("hidden");
      kitchenStation.querySelector(".bowl").classList.remove("hidden");

      // New customer pops up in the hatch
      customerFace.classList.remove("bounce");
      playAnimation(customerFace, "arrive");

      showMessage("A customer! Turn around to the pantry for ingredients 🔄", "");
      nextButton.classList.add("hidden");
      turnButton.classList.remove("hidden");
      turnButton.classList.add("pulse");
    }

    nextButton.addEventListener("click", newCustomer);
    washButton.addEventListener("click", washBowl);

    // When the customer's arrive animation ends, go back to gentle bobbing
    customerFace.addEventListener("animationend", function (event) {
      if (event.animationName === "arrive") customerFace.classList.remove("arrive");
    });

    // ============================================================
    // START THE GAME
    // ============================================================

    allBowls().forEach(buildBowl);
    layoutKitchen();
    window.addEventListener("resize", layoutKitchen);
    newCustomer();
  </script>
</body>
</html>
